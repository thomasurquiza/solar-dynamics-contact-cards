<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Solar Dynamics Contact Cards</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: #1f2421;
        background: #f1f6f1;
      }
      main {
        width: min(88vw, 420px);
        padding: 34px;
        border: 1px solid #dce7de;
        border-radius: 24px;
        text-align: center;
        background: white;
        box-shadow: 0 18px 50px rgba(18, 56, 35, 0.12);
      }
      h1 {
        margin: 0 0 10px;
        color: #0d5b32;
      }
      p {
        margin: 0;
        color: #626c65;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Solar Dynamics</h1>
      <p>Scan an employee badge QR code to open their contact card.</p>
    </main>
  </body>
</html>
